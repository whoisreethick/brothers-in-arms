<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 340px;
      background: #080C08;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #F0F7F0;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.02);
    }

    .logo-mark {
      width: 32px; height: 32px;
      border-radius: 9px;
      background: rgba(37,211,102,0.12);
      border: 1px solid rgba(37,211,102,0.3);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .logo-inner {
      width: 14px; height: 14px;
      border-radius: 4px;
      background: #25D366;
    }

    .header-text h1 { font-size: 14px; font-weight: 700; letter-spacing: 0.2px; }
    .header-text p  { font-size: 11px; color: #6B8F6B; margin-top: 2px; letter-spacing: 0.3px; }

    .body { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }

    label { font-size: 10px; font-weight: 700; color: #6B8F6B; letter-spacing: 1.8px; display: block; margin-bottom: 6px; }

    textarea {
      width: 100%;
      height: 110px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 13px;
      color: #F0F7F0;
      resize: none;
      line-height: 1.6;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    textarea:focus { border-color: rgba(37,211,102,0.3); }
    textarea::placeholder { color: #3D5C3D; }

    .btn {
      width: 100%;
      padding: 13px;
      background: #25D366;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      color: #000;
      cursor: pointer;
      letter-spacing: 0.3px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { background: rgba(37,211,102,0.15); color: #25D366; cursor: not-allowed; }

    .tip {
      font-size: 11px;
      color: #3D5C3D;
      text-align: center;
      line-height: 1.5;
      letter-spacing: 0.2px;
    }
    .tip strong { color: #6B8F6B; }

    /* Result */
    .result { display: none; flex-direction: column; gap: 12px; }
    .result-strip { height: 3px; margin: -16px -18px 0; }

    .verdict-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
    }

    .badge {
      padding: 5px 11px;
      border-radius: 7px;
      border: 1px solid;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.5px;
    }

    .score {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -2px;
      line-height: 1;
    }
    .score-unit { font-size: 18px; font-weight: 600; }

    .bar-track {
      height: 4px;
      background: rgba(255,255,255,0.06);
      border-radius: 100px;
      overflow: hidden;
      margin-top: 6px;
    }
    .bar-fill {
      height: 100%;
      border-radius: 100px;
      width: 0%;
      transition: width 1.2s cubic-bezier(0.16,1,0.3,1);
    }

    .divider { height: 1px; background: rgba(255,255,255,0.06); }

    .field-label { font-size: 10px; font-weight: 700; color: #6B8F6B; letter-spacing: 1.8px; margin-bottom: 5px; }
    .field-text  { font-size: 12px; color: #D0EDD0; line-height: 1.7; }

    .chips { display: flex; flex-wrap: wrap; gap: 5px; }
    .chip {
      padding: 3px 8px;
      border-radius: 5px;
      background: rgba(255,68,68,0.08);
      border: 1px solid rgba(255,68,68,0.2);
      font-size: 11px; color: #FF6666; font-weight: 600;
    }

    .reset-btn {
      width: 100%;
      padding: 11px;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      color: #6B8F6B;
      cursor: pointer;
      letter-spacing: 0.3px;
      transition: border-color 0.2s;
    }
    .reset-btn:hover { border-color: rgba(255,255,255,0.15); }

    .error-msg { font-size: 12px; color: #FF6666; text-align: center; padding: 8px 0; }

    .loading-state {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 20px 0;
    }
    .spinner {
      width: 28px; height: 28px;
      border: 2px solid rgba(37,211,102,0.2);
      border-top-color: #25D366;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 12px; color: #6B8F6B; font-weight: 500; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-mark"><div class="logo-inner"></div></div>
    <div class="header-text">
      <h1>Misinfo Firewall</h1>
      <p>AI-powered fact verification</p>
    </div>
  </div>

  <div class="body">
    <!-- Input state -->
    <div id="input-state">
      <div>
        <label>MESSAGE TO VERIFY</label>
        <textarea id="msg-input" placeholder="Paste the WhatsApp forward here..."></textarea>
      </div>
      <div id="error-msg" class="error-msg" style="display:none"></div>
      <button class="btn" id="check-btn">Run Analysis</button>
      <p class="tip">Or <strong>right-click</strong> any selected text on any webpage to check it instantly.</p>
    </div>

    <!-- Loading state -->
    <div class="loading-state" id="loading-state">
      <div class="spinner"></div>
      <span class="loading-text">Scanning with AI + fact databases...</span>
    </div>

    <!-- Result state -->
    <div class="result" id="result-state">
      <div class="result-strip" id="result-strip"></div>
      <div class="verdict-row">
        <span class="badge" id="result-badge"></span>
        <span class="score" id="result-score" style="">0<span class="score-unit">%</span></span>
      </div>
      <div>
        <div class="bar-track"><div class="bar-fill" id="result-bar"></div></div>
      </div>
      <div class="divider"></div>
      <div>
        <div class="field-label">ANALYSIS</div>
        <div class="field-text" id="result-summary"></div>
      </div>
      <div id="result-flags-section">
        <div class="field-label">RED FLAGS</div>
        <div class="chips" id="result-flags"></div>
      </div>
      <div class="divider"></div>
      <div>
        <div class="field-label">RECOMMENDATION</div>
        <div class="field-text" id="result-advice"></div>
      </div>
      <button class="reset-btn" id="reset-btn">Check Another Message</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
